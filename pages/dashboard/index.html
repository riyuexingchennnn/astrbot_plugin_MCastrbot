<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCBot 监控面板</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<header>
  <h1 id="pageTitle">🎮 MCBot 监控面板</h1>
  <span id="badge" class="badge"><span class="dot"></span><span id="badgeText">连接中</span></span>
  <label class="control-toggle" for="controlSwitch">
    <span class="control-label">机器人</span>
    <input id="controlSwitch" type="checkbox" role="switch" disabled />
    <span class="control-track" aria-hidden="true"><span class="control-thumb"></span></span>
    <span id="controlState" class="control-state">已停止</span>
  </label>
  <span id="controlError" class="control-error" role="status"></span>
  <span class="spacer"></span>
  <span class="muted" id="target"></span>
  <span class="muted" id="updated"></span>
</header>

<main>
  <div class="grid">
    <div class="card">
      <h2>连接状态</h2>
      <div class="kv"><span class="k">机器人</span><span class="v" id="username">-</span></div>
      <div class="kv"><span class="k">状态</span><span class="v" id="status">-</span></div>
      <div class="kv"><span class="k">本次在线</span><span class="v" id="onlineDur">-</span></div>
      <div class="kv"><span class="k">累计在线</span><span class="v" id="totalDur">-</span></div>
      <div class="kv"><span class="k">重连次数</span><span class="v" id="reconnect">-</span></div>
      <div class="kv"><span class="k">进程运行</span><span class="v" id="uptime">-</span></div>
    </div>

    <div class="card">
      <h2>游戏内状态</h2>
      <div class="kv"><span class="k">坐标</span><span class="v" id="pos">-</span></div>
      <div class="kv"><span class="k">维度</span><span class="v" id="dim">-</span></div>
      <div class="kv"><span class="k">游戏模式</span><span class="v" id="mode">-</span></div>
      <div class="kv"><span class="k">生命值</span><span class="v" id="health">-</span></div>
      <div class="kv"><span class="k">饥饿值</span><span class="v" id="food">-</span></div>
      <div class="kv"><span class="k">附近实体</span><span class="v" id="entities">-</span></div>
    </div>

    <div class="card">
      <h2>服务器</h2>
      <div class="kv"><span class="k">地址</span><span class="v" id="addr">-</span></div>
      <div class="kv"><span class="k">协议版本</span><span class="v" id="ver">-</span></div>
      <div class="kv"><span class="k">在线玩家</span><span class="v big" id="pcount">-</span></div>
      <div class="kv"><span class="k">世界时间</span><span class="v" id="tod">-</span></div>
      <div class="kv"><span class="k">天气</span><span class="v" id="weather">-</span></div>
    </div>

    <div class="card">
      <h2>异常记录</h2>
      <div class="kv"><span class="k">最近错误</span><span class="v" id="lastError">无</span></div>
      <div class="kv"><span class="k">最近踢出</span><span class="v" id="lastKick">无</span></div>
      <div class="kv"><span class="k">最近断开</span><span class="v" id="lastDisc">无</span></div>
    </div>

    <div class="card full">
      <h2>在线玩家</h2>
      <ul id="players"><li class="muted">暂无数据</li></ul>
    </div>

    <div class="card full">
      <h2>游戏内消息</h2>
      <ul id="chat"><li class="muted">暂无消息</li></ul>
    </div>

    <div class="card full">
      <h2>运行日志</h2>
      <ul id="logs"><li class="muted">暂无日志</li></ul>
    </div>
  </div>

  <footer class="muted">
    面板每 2 秒自动刷新 · 数据来自 AstrBot 插件
  </footer>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
